name: Private Jets historical ingest

on:
  workflow_dispatch:
    inputs:
      from:
        description: First UTC calendar date (inclusive)
        required: true
        type: string
      to:
        description: Last UTC calendar date (inclusive)
        required: true
        type: string
      force:
        description: Reprocess dates already imported successfully
        required: true
        default: false
        type: boolean
      source:
        description: Dispatch source
        required: true
        type: choice
        options:
          - scheduled
          - manual
      job_id:
        description: Existing PaperStraw historical job ID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: private-jets-historical-${{ inputs.from }}-${{ inputs.to }}
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PRIVATE_JETS_DATABASE_URL: ${{ secrets.PRIVATE_JETS_DATABASE_URL }}
      DATABASE_URL: ${{ secrets.PRIVATE_JETS_DATABASE_URL }}
      GITHUB_TOKEN: ${{ secrets.ADSB_LOL_GITHUB_TOKEN || github.token }}
      FROM_DATE: ${{ inputs.from }}
      TO_DATE: ${{ inputs.to }}
      FORCE_REPROCESS: ${{ inputs.force }}
      EXECUTION_SOURCE: ${{ inputs.source }}
      HISTORICAL_JOB_ID: ${{ inputs.job_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run shared historical importer
        shell: bash
        run: |
          args=(--from "$FROM_DATE" --to "$TO_DATE" --execution-source "$EXECUTION_SOURCE" --job-id "$HISTORICAL_JOB_ID")
          if [[ "$FORCE_REPROCESS" == "true" ]]; then
            args+=(--force)
          fi
          pnpm ingest:historical "${args[@]}"
